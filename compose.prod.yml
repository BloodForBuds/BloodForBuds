services:
  app-database:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-bloodforbuds}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-bloodforbuds}
      POSTGRES_USER: ${APP_DB_USER:-bloodforbuds}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - app
    restart: unless-stopped
    volumes:
      - app_store_data:/var/lib/postgresql/data

  key-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${KEY_DB_NAME:-bloodforbuds_keys}
      POSTGRES_PASSWORD: ${KEY_DB_PASSWORD:-bloodforbuds_keys}
      POSTGRES_USER: ${KEY_DB_USER:-bloodforbuds_keys}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - app
    restart: unless-stopped
    volumes:
      - key_store_data:/var/lib/postgresql/data

  openbao:
    image: openbao/openbao:2.6.2
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    expose:
      - "8200"
    healthcheck:
      test: ["CMD-SHELL", "bao status -address=http://127.0.0.1:8200 >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    mem_swappiness: 0
    memswap_limit: 512m
    networks:
      - app
    restart: unless-stopped
    volumes:
      - ./services/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao_data:/openbao/file

  caddy:
    build:
      context: ./services/caddy
    depends_on:
      frontend:
        condition: service_started
      server:
        condition: service_healthy
    networks:
      - edge
      - app
    ports:
      - "80:80"
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
      target: production
    expose:
      - "3000"
    networks:
      - app
    restart: unless-stopped

  server:
    build:
      context: ./services/server
      target: production
    depends_on:
      app-database:
        condition: service_healthy
      key-database:
        condition: service_healthy
      openbao:
        condition: service_healthy
    environment:
      APP_DB_HOST: app-database
      APP_DB_NAME: ${APP_DB_NAME:-bloodforbuds}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-bloodforbuds}
      APP_DB_PORT: "5432"
      APP_DB_SSLMODE: ${APP_DB_SSLMODE:-disable}
      APP_DB_USER: ${APP_DB_USER:-bloodforbuds}
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${BAO_TOKEN:-}
      KEY_DB_HOST: key-database
      KEY_DB_NAME: ${KEY_DB_NAME:-bloodforbuds_keys}
      KEY_DB_PASSWORD: ${KEY_DB_PASSWORD:-bloodforbuds_keys}
      KEY_DB_PORT: "5432"
      KEY_DB_SSLMODE: ${KEY_DB_SSLMODE:-disable}
      KEY_DB_USER: ${KEY_DB_USER:-bloodforbuds_keys}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app
    restart: unless-stopped

networks:
  edge:
  app:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    internal: true

volumes:
  app_store_data:
    name: bloodforbuds_prod_database_data
  key_store_data:
    name: bloodforbuds_prod_key_store_data
  openbao_data:
    name: bloodforbuds_prod_openbao_data
