services:
  caddy:
    build:
      context: ./services/caddy
    depends_on:
      frontend:
        condition: service_started
      server:
        condition: service_healthy
    networks:
      - edge
      - app
    ports:
      - "80:80"
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
      target: production
    expose:
      - "3000"
    networks:
      - app
    restart: unless-stopped

  server:
    build:
      context: ./services/server
      target: production
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app
    restart: unless-stopped

networks:
  edge:
  app:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    internal: true
