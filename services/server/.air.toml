root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/httpserver"
entrypoint = ["./tmp/server"]
include_ext = ["go"]
exclude_dir = ["tmp"]
exclude_unchanged = true
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = 500000000

[log]
time = true

[misc]
clean_on_exit = false
