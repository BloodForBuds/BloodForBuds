services:
  app-database:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${APP_DB_NAME:?set APP_DB_NAME}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      POSTGRES_USER: ${APP_DB_USER:?set APP_DB_USER}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app
    restart: unless-stopped
    volumes:
      - app_store_data:/var/lib/postgresql/data

  key-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${KEY_DB_NAME:?set KEY_DB_NAME}
      POSTGRES_PASSWORD: ${KEY_DB_PASSWORD:?set KEY_DB_PASSWORD}
      POSTGRES_USER: ${KEY_DB_USER:?set KEY_DB_USER}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app
    restart: unless-stopped
    volumes:
      - key_store_data:/var/lib/postgresql/data

  openbao:
    image: openbao/openbao:2.6.2
    command: ["server", "-dev"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_API_ADDR: http://openbao:8200
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_DEV_ROOT_TOKEN_ID:?set BAO_DEV_ROOT_TOKEN_ID}
    expose:
      - "8200"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 512m
    mem_swappiness: 0
    memswap_limit: 512m
    networks:
      - app
    restart: unless-stopped

  firebase-auth:
    build:
      context: ./services/firebase
    expose:
      - "9099"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9099/emulator/v1/projects/demo-bloodforbuds/config"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - app
    restart: unless-stopped

  caddy:
    build:
      context: ./services/caddy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.dev", "--adapter", "caddyfile", "--watch"]
    depends_on:
      firebase-auth:
        condition: service_healthy
      frontend:
        condition: service_started
      server:
        condition: service_healthy
    networks:
      - edge
      - app
    ports:
      - "3456:80"
    restart: unless-stopped
    volumes:
      - ./services/caddy:/etc/caddy:ro

  frontend:
    build:
      context: ./services/frontend
      target: development
    expose:
      - "3000"
    networks:
      - app
    restart: unless-stopped
    volumes:
      - ./services/frontend:/app
      - /app/node_modules

  server:
    build:
      context: ./services/server
      target: development
    depends_on:
      app-database:
        condition: service_healthy
      key-database:
        condition: service_healthy
      openbao:
        condition: service_healthy
      firebase-auth:
        condition: service_healthy
    environment:
      APP_DB_HOST: app-database
      APP_DB_NAME: ${APP_DB_NAME:?set APP_DB_NAME}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      APP_DB_PORT: "5432"
      APP_DB_SSLMODE: ${APP_DB_SSLMODE:?set APP_DB_SSLMODE}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER}
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${BAO_TOKEN:?set BAO_TOKEN}
      AUTH_COOKIE_SECURE: "false"
      AUTH_MAX_AGE: ${AUTH_MAX_AGE:?set AUTH_MAX_AGE}
      AUTH_SESSION_DURATION: ${AUTH_SESSION_DURATION:?set AUTH_SESSION_DURATION}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      FIREBASE_PROJECT_ID: demo-bloodforbuds
      FIREBASE_USE_EMULATOR: "true"
      FIREBASE_WEB_API_KEY: fake-api-key
      FIREBASE_WEB_APP_ID: demo-bloodforbuds-web
      FIREBASE_WEB_AUTH_DOMAIN: localhost
      KEY_DB_HOST: key-database
      KEY_DB_NAME: ${KEY_DB_NAME:?set KEY_DB_NAME}
      KEY_DB_PASSWORD: ${KEY_DB_PASSWORD:?set KEY_DB_PASSWORD}
      KEY_DB_PORT: "5432"
      KEY_DB_SSLMODE: ${KEY_DB_SSLMODE:?set KEY_DB_SSLMODE}
      KEY_DB_USER: ${KEY_DB_USER:?set KEY_DB_USER}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app
    restart: unless-stopped
    volumes:
      - ./services/server:/src
      - /src/tmp

networks:
  edge:
  app:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    internal: true

volumes:
  app_store_data:
    name: bloodforbuds_dev_database_data
  key_store_data:
    name: bloodforbuds_dev_key_store_data
