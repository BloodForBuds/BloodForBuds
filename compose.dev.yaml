services:
  app-database:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: bloodforbuds
      POSTGRES_PASSWORD: bloodforbuds
      POSTGRES_USER: bloodforbuds
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app
    restart: unless-stopped
    volumes:
      - app_store_data:/var/lib/postgresql/data

  key-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bloodforbuds_keys
      POSTGRES_PASSWORD: bloodforbuds_keys
      POSTGRES_USER: bloodforbuds_keys
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app
    restart: unless-stopped
    volumes:
      - key_store_data:/var/lib/postgresql/data

  openbao:
    image: openbao/openbao:2.6.2
    command: ["server", "-dev"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_API_ADDR: http://openbao:8200
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_DEV_ROOT_TOKEN_ID: bloodforbuds-dev-only
    expose:
      - "8200"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 512m
    mem_swappiness: 0
    memswap_limit: 512m
    networks:
      - app
    restart: unless-stopped

  caddy:
    build:
      context: ./services/caddy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    depends_on:
      frontend:
        condition: service_started
      server:
        condition: service_healthy
    networks:
      - edge
      - app
    ports:
      - "3456:80"
    restart: unless-stopped
    volumes:
      - ./services/caddy:/etc/caddy:ro

  frontend:
    build:
      context: ./services/frontend
      target: development
    expose:
      - "3000"
    networks:
      - app
    restart: unless-stopped
    volumes:
      - ./services/frontend:/app
      - /app/node_modules

  server:
    build:
      context: ./services/server
      target: development
    depends_on:
      app-database:
        condition: service_healthy
      key-database:
        condition: service_healthy
      openbao:
        condition: service_healthy
    environment:
      APP_DB_HOST: app-database
      APP_DB_NAME: bloodforbuds
      APP_DB_PASSWORD: bloodforbuds
      APP_DB_PORT: "5432"
      APP_DB_USER: bloodforbuds
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: bloodforbuds-dev-only
      KEY_DB_HOST: key-database
      KEY_DB_NAME: bloodforbuds_keys
      KEY_DB_PASSWORD: bloodforbuds_keys
      KEY_DB_PORT: "5432"
      KEY_DB_USER: bloodforbuds_keys
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app
    restart: unless-stopped
    volumes:
      - ./services/server:/src
      - /src/tmp

networks:
  edge:
  app:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    internal: true

volumes:
  app_store_data:
    name: bloodforbuds_dev_database_data
  key_store_data:
    name: bloodforbuds_dev_key_store_data
