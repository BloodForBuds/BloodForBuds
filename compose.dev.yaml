services:
  database:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: bloodforbuds
      POSTGRES_PASSWORD: bloodforbuds
      POSTGRES_USER: bloodforbuds
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app
    restart: unless-stopped
    volumes:
      - database_data:/var/lib/postgresql/data

  caddy:
    build:
      context: ./services/caddy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    depends_on:
      frontend:
        condition: service_started
      server:
        condition: service_healthy
    networks:
      - edge
      - app
    ports:
      - "3456:80"
    restart: unless-stopped
    volumes:
      - ./services/caddy:/etc/caddy:ro

  frontend:
    build:
      context: ./services/frontend
      target: development
    expose:
      - "3000"
    networks:
      - app
    restart: unless-stopped
    volumes:
      - ./services/frontend:/app
      - /app/node_modules

  server:
    build:
      context: ./services/server
      target: development
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGDATABASE: bloodforbuds
      PGHOST: database
      PGPASSWORD: bloodforbuds
      PGPORT: "5432"
      PGUSER: bloodforbuds
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app
    restart: unless-stopped
    volumes:
      - ./services/server:/src
      - /src/tmp

networks:
  edge:
  app:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    internal: true

volumes:
  database_data:
    name: bloodforbuds_dev_database_data
